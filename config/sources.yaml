# YouTube channels ingested via the public per-channel Atom feed
# (https://www.youtube.com/feeds/videos.xml?channel_id=...). No auth required.
# Used only when YOUTUBE_API_KEY is absent; with a key, keyword search is used.
# Channel IDs that return no entries are reported as an error, not silently dropped.
youtube_channels:
  - name: "Podium"
    channel_id: "UCTM8mnJ_pnBWvIcNlfXOTMg"
    note: "Verify with scripts/verify_youtube.py if the feed returns no entries."
