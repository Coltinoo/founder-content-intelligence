# Restrained, executive-friendly presentation.
# Intelligence dashboard, not a social-media scheduler.
#
# Colours are Podium's own published design tokens, so Streamlit's built-in
# widgets (selectboxes, sliders, progress bars) match the custom CSS in
# fcie/ui/components.py instead of falling back to Streamlit red.
# `base = "light"` is load-bearing: see the prefers-color-scheme note in
# components.py for what happens when the theme and the CSS disagree.

[theme]
base = "light"
# Terracotta — the accent Podium leads with on the AI Employee page. Streamlit
# derives widget accents from this; the primary button's label is set explicitly
# in components.py because Streamlit takes it from textColor and would put dark
# ink on the fill. White on #AF4E30 measures 5.31:1.
primaryColor = "#AF4E30"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F5F0"
textColor = "#1C1D18"
# Podium sets Graphik, which is proprietary. Inter is their own declared
# fallback and the closest freely available face. Set here rather than in CSS
# because Streamlit's own font rules outrank a stylesheet appended to the page —
# a `font-family` in components.py loses to Source Sans on every element it
# styles. Everything after Inter is a system face, so nothing is fetched at
# render time and the stack degrades cleanly on a machine without Inter.
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"

[server]
headless = true
# CORS is left enabled: setting it false while XSRF protection is on is
# contradictory and Streamlit overrides it back with a warning.
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
