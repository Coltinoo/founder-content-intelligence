# RSS / Atom feeds — the primary zero-credential source of genuine public data.
#
# Every entry below was fetched successfully by `python scripts/verify_feeds.py`
# and returned real entries. Feeds that fail at runtime are recorded with an
# error and skipped; the app runs fine with zero working feeds.
#
# Re-verify at any time:
#   python scripts/verify_feeds.py
#   python scripts/verify_feeds.py --disable-broken

