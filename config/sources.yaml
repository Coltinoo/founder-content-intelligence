# Allowlisted domains and seed URLs for first-party crawling.
#
# The crawler will ONLY fetch pages whose host is in `allowed_domains`.
# It never bypasses robots.txt, paywalls, logins, rate limits, or captchas.
#
# Every seed below was verified to return HTTP 200 with real content. Seeds that
# 404 later are recorded as `skipped` with the reason and do not fail the run —
# add or correct URLs here as the site changes.

allowed_domains:
  - podium.com
  - www.podium.com
  - job-boards.greenhouse.io   # Podium's public job board only, via the seed below

# Domains the company owns. Content from these is *our own voice*, not a market
# signal — it is useful for knowing what we have already published and for the
# editorial baseline, but it must never count as independent corroboration or
# rank as "what the market is saying". Counting your own marketing as evidence
# that the market agrees with you is how a content engine starts measuring its
# own echo. Subdomains are matched automatically, so `podium.com` also covers
# homeservices.podium.com and automotive.podium.com.
first_party_domains:
  - podium.com
  # The job board is Podium's public careers listing. It is first-party *and*
  # not market intelligence at all — a job posting says nothing about the
  # market — so it is excluded from signals entirely rather than merely
  # labelled.
  - job-boards.greenhouse.io

# Public social discussion, found through the search index — never by crawling.
#
# These platforms stay in `blocked_domains` below and are never fetched, logged
# into, or contacted. This connector asks the same lawful search API used
# elsewhere for publicly indexed posts and keeps only what the index already
# publishes: title, snippet, URL, date. Items are emitted with
# `needs_fetch: false`, so no request is ever made to these hosts.
#
# It buys reach, not depth: snippets rather than full posts, no comment threads,
# no reactions, and no coverage of anything search has not indexed. Anything
# richer than this needs a human to paste it, or an official platform API.
social_discovery:
  enabled: true
  results_per_query: 6
  platforms:
    - name: LinkedIn
      site: linkedin.com/posts
    - name: X
      site: x.com
  topics:
    - "missed calls costing local businesses"
    - "speed to lead follow up"
    - "AI employee for small business"
    - "AI agents local business revenue"
    - "online reviews local business"
    - "text messaging customers business"

# Never fetched programmatically, regardless of the allowlist.
# LinkedIn content enters the system only through the manual Voice Library form
# or, for public posts, as search-index metadata via `social_discovery` above —
# which never contacts these hosts.
blocked_domains:
  - linkedin.com
  - www.linkedin.com
  - facebook.com
  - instagram.com
  - x.com
  - twitter.com
  - threads.net
  - tiktok.com

