# Allowlisted domains and seed URLs for first-party crawling.
#
# The crawler will ONLY fetch pages whose host is in `allowed_domains`.
# It never bypasses robots.txt, paywalls, logins, rate limits, or captchas.
#
# Every seed below was verified to return HTTP 200 with real content. Seeds that
# 404 later are recorded as `skipped` with the reason and do not fail the run —
# add or correct URLs here as the site changes.

allowed_domains:
  - podium.com
  - www.podium.com
  - job-boards.greenhouse.io   # Podium's public job board only, via the seed below

# Domains the company owns. Content from these is *our own voice*, not a market
# signal — it is useful for knowing what we have already published and for the
# editorial baseline, but it must never count as independent corroboration or
# rank as "what the market is saying". Counting your own marketing as evidence
# that the market agrees with you is how a content engine starts measuring its
# own echo. Subdomains are matched automatically, so `podium.com` also covers
# homeservices.podium.com and automotive.podium.com.
first_party_domains:
  - podium.com
  # The job board is Podium's public careers listing. It is first-party *and*
  # not market intelligence at all — a job posting says nothing about the
  # market — so it is excluded from signals entirely rather than merely
  # labelled.
  - job-boards.greenhouse.io

# Public social discussion, found through the search index — never by crawling.
#
# These platforms stay in `blocked_domains` below and are never fetched, logged
# into, or contacted. This connector asks the same lawful search API used
# elsewhere for publicly indexed posts and keeps only what the index already
# publishes: title, snippet, URL, date. Items are emitted with
# `needs_fetch: false`, so no request is ever made to these hosts.
#
# It buys reach, not depth: snippets rather than full posts, no comment threads,
# no reactions, and no coverage of anything search has not indexed. Anything
# richer than this needs a human to paste it, or an official platform API.
social_discovery:
  enabled: true
  # Yield is the binding constraint here, not cost: most hits are filtered out
  # for age or for not being posts, so ask for more and filter harder.
  results_per_query: 10
  max_age_days: 45
  platforms:
    - name: LinkedIn
      site: linkedin.com/posts
    - name: LinkedIn
      site: linkedin.com/pulse
    - name: X
      site: x.com
  # Search the customer's language, not the vendor's.
  #
  # The first widened run returned 30 posts of which 19 were vendor marketing —
  # AI-answering-service companies recycling the same "$126,000 in missed calls"
  # stat at each other. Those terms find competitors, not customers, and
  # commenting on a competitor's lead-gen post reads as a vendor spat.
  # Business owners describing the problem use plain, first-person phrasing.
  topics:
    - "I keep missing customer calls"
    - "cant answer the phone while working"
    - "how do you handle calls when busy"
    - "should I hire a receptionist small business"
    - "losing customers because nobody answered"
    - "leads going cold before I call back"
    - "how do you follow up with leads"
    - "asking customers for google reviews"
    - "how do you get more reviews"
    - "texting customers instead of calling"
    - "running a service business solo"
    - "HVAC business slow season leads"
    - "contractor scheduling nightmare"
    - "dealership internet leads follow up"

# Reddit, through the official Data API — not the RSS feeds.
#
# reddit.com/robots.txt is `Disallow: /` for every agent, so the public
# search.rss endpoints are off limits even though they return data. The
# sanctioned route is an OAuth app credential (REDDIT_CLIENT_ID /
# REDDIT_CLIENT_SECRET), which is an API key rather than anyone's account login.
# Free for non-commercial use. Until those are set the channel reports itself
# unconfigured and the rest of the pipeline runs unchanged.
#
# This is the richest source available for this market: owners describing the
# problem in their own words, at length, while actively asking for help.
reddit_discovery:
  enabled: true
  results_per_query: 10
  max_age_days: 45
  subreddits:
    - smallbusiness
    - Entrepreneur
    - HVAC
    - plumbing
    - AutoDetailing
    - Contractors
  queries:
    - "missed calls"
    - "answering service"
    - "follow up leads"
    - "booking appointments software"
    - "customer reviews"

# Never fetched programmatically, regardless of the allowlist.
# LinkedIn content enters the system only through the manual Voice Library form
# or, for public posts, as search-index metadata via `social_discovery` above —
# which never contacts these hosts.
blocked_domains:
  - linkedin.com
  - www.linkedin.com
  - facebook.com
  - instagram.com
  - x.com
  - twitter.com
  - threads.net
  - tiktok.com

